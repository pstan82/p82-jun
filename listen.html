<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Live Radio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:20px;text-align:center}
button{padding:18px 40px;margin:10px;font-size:20px;border-radius:14px;border:0;background:#0a84ff;color:#fff}
audio{width:100%;margin-top:20px}
</style>
</head>
<body>
<h2>Live Radio</h2>
<button onclick="play()">▶️ Listen Live</button>
<audio id="p" controls></audio>
<script>
const p = document.getElementById('p');
function play(){ 
  p.src='https://stream.radioparadise.com/mp3-32'; 
  p.loop=true;
  p.play(); 
}
</script>
</body>
</html>
