<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJ Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:15px;max-width:800px;margin:auto}
input,button{padding:10px;margin:4px;border-radius:8px;border:0;font-size:15px}
button{background:#0a84ff;color:#fff}.danger{background:#ff3b30}.ghost{background:#333}
#list{list-style:none;padding:0} #list li{padding:12px;background:#1a1a1a;margin:5px 0;border-radius:8px;cursor:pointer}
#list li.active{border-left:4px solid #0a84ff}
audio{width:100%;margin-top:15px}
</style>
</head>
<body>
<h2>DJ Control</h2>

<input id="url" placeholder="Paste https radio stream URL">
<button onclick="add()">Add to Playlist</button>
<button onclick="play()">Play</button>
<button onclick="next()">Next</button>
<button class="danger" id="recBtn" onclick="toggleRec()">Rec Voice</button>
<button class="ghost" onclick="savePl()">Save</button>
<button class="ghost" onclick="loadPl()">Load</button>

<ul id="list"></ul>
<audio id="player" controls></audio>

<script>
let playlist = JSON.parse(localStorage.getItem('pl')||'[]');
let i = 0; const p = document.getElementById('player');
let recorder, chunks=[];

function saveState(){ localStorage.setItem('pl', JSON.stringify(playlist)); render(); }
function render(){
  list.innerHTML='';
  playlist.forEach((u,idx)=>{
    let li=document.createElement('li');
    if(i==idx) li.className='active';
    li.innerText=`${idx+1}. ${u.title}`;
    li.onclick=()=>{i=idx; play()};
    list.appendChild(li);
  });
}

function add(){
  let u = url.value.trim(); if(!u) return;
  playlist.push({type:'url', src:u, title:u.split('/').pop().slice(0,30)});
  url.value=''; saveState();
}

function playItem(item){
  p.src = item.src;
  p.play().catch(e=>alert('Play failed: '+e.message));
}
function play(){ if(playlist.length) playItem(playlist[i]); render(); }
function next(){ i=(i+1)%playlist.length; play(); }

async function toggleRec(){
  if(!recorder){
    let s = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(s);
    chunks=[];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      let blob = new Blob(chunks, {type:'audio/webm'});
      playlist.push({type:'blob', src:URL.createObjectURL(blob), title:'[VOICE] '+new Date().toLocaleTimeString()});
      chunks=[]; recorder=null; recBtn.innerText='Rec Voice'; saveState();
    }
    recorder.start(); recBtn.innerText='Stop Rec';
  } else { recorder.stop(); }
}

function savePl(){ localStorage.setItem('pl_backup', JSON.stringify(playlist)); alert('Saved'); }
function loadPl(){ playlist = JSON.parse(localStorage.getItem('pl_backup')||'[]'); i=0; saveState(); }

p.onended = next; render();
</script>
</body>
</html>
