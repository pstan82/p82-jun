<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJ Mixer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:15px;max-width:600px;margin:auto;text-align:center}
button{padding:16px;margin:8px 0;border-radius:12px;border:0;width:100%;background:#0a84ff;color:#fff;font-size:18px;font-weight:bold}
.rec{background:#ff3b30}.recording{background:#34c759}
#status{color:#0f0;margin-top:15px}
#vol{width:100%}
</style>
</head>
<body>
<h2>DJ Mixer</h2>

<button onclick="playMusic()">▶️ Play Radio 32k</button>
<button id="micBtn" class="rec" onclick="toggleMic()">🎤 Hold to Talk</button>
<input id="vol" type="range" min="0" max="100" value="30" oninput="setMusicVol(this.value)">
<div>Music Volume: <span id="volTxt">30</span>%</div>
<div id="status">Ready</div>

<script>
let music = new Audio();
let mic = new Audio();
let ctx, musicNode, micNode, gainNode;
let isPlaying = false;

const RADIO_URL = 'https://stream.radioparadise.com/mp3-32';

// Setup Web Audio Mixer
async function setupAudio(){
  if(ctx) return;
  ctx = new AudioContext();
  gainNode = ctx.createGain();
  gainNode.gain.value = 0.3; // 30% default
  
  musicNode = ctx.createMediaElementSource(music);
  micNode = ctx.createMediaElementSource(mic);
  
  musicNode.connect(gainNode).connect(ctx.destination);
  micNode.connect(ctx.destination); // mic at 100%
}

function setMusicVol(v){
  volTxt.innerText = v;
  if(gainNode) gainNode.gain.value = v/100;
}

async function playMusic(){
  await setupAudio();
  if(!isPlaying){
    music.src = RADIO_URL;
    music.crossOrigin = "anonymous";
    music.loop = true; // no stop
    await music.play();
    isPlaying = true;
    status.innerText = 'Music Playing at 30%';
  }
}

let mediaRec, chunks=[];
async function toggleMic(){
  await setupAudio();
  if(!mediaRec){
    let stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec = new MediaRecorder(stream);
    chunks = [];
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = () => {
      let blob = new Blob(chunks, {type:'audio/webm'});
      mic.src = URL.createObjectURL(blob);
      mic.play(); // plays over music
      status.innerText = 'Played voice over music';
    }
    mediaRec.start();
    micBtn.innerText = '⏹️ Release to Send';
    micBtn.className = 'recording';
    status.innerText = 'Recording... music ducked to 30%';
  } else {
    mediaRec.stop();
    mediaRec.stream.getTracks().forEach(t=>t.stop());
    mediaRec = null;
    micBtn.innerText = '🎤 Hold to Talk';
    micBtn.className = 'rec';
  }
}

// Auto-resume music if it stops
music.onended = ()=>{ music.play(); }
</script>
</body>
</html>
