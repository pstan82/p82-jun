<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎧 DJ Player</title>
<style>
  body { background:#111; color:#eee; font-family: Arial; text-align:center; padding:20px; }
  #search { width: 60%; padding:12px; border-radius:8px; border:none; font-size:16px; }
  button { padding:12px 20px; border:none; border-radius:8px; background:#1DB954; color:#fff; cursor:pointer; margin-left:5px; }
  #results { margin-top:20px; text-align:left; max-width:600px; margin:auto; }
  .track { padding:10px; border-bottom:1px solid #333; cursor:pointer; }
  .track:hover { background:#222; }
  audio { width:100%; margin-top:20px; }
  #status { color:#aaa; margin-top:10px; }
</style>
</head>
<body>
<h1>🎧 DJ Player</h1>
<input id="search" type="text" placeholder="Search artist or song...">
<button onclick="searchTrack()">Search</button>
<div id="status"></div>
<div id="results"></div>
<audio id="player" controls></audio>
<script>
const BACKEND_URL = "https://redesigned-potato-q7vq979697vw26wg9-5000.app.github.dev";

async function searchTrack() {
  const query = document.getElementById('search').value;
  const resultsDiv = document.getElementById('results');
  const statusDiv = document.getElementById('status');
  resultsDiv.innerHTML = "";
  statusDiv.innerText = "Searching...";
  try {
    const res = await fetch(`${BACKEND_URL}/search?q=` + encodeURIComponent(query));
    if(!res.ok) throw new Error("Server error " + res.status);
    const data = await res.json();
    statusDiv.innerText = `Found ${data.length} results from YouTube`;
    showResults(data);
  } catch(e) {
    statusDiv.innerText = "Error: " + e.message;
    console.error(e);
  }
}
function showResults(tracks) {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = "";
  tracks.forEach(t => {
    const div = document.createElement('div');
    div.className = "track";
    div.innerText = `${t.artist} - ${t.title}`;
    div.onclick = () => playTrack(t.url);
    resultsDiv.appendChild(div);
  });
}
function playTrack(url) {
  const player = document.getElementById('player');
  const statusDiv = document.getElementById('status');
  player.src = `${BACKEND_URL}/play?url=` + encodeURIComponent(url);
  statusDiv.innerText = "Loading from YouTube...";
  player.play();
}
</script>
</body>
</html>
