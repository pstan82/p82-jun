<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJ Dual Mixer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:15px;max-width:650px;margin:auto}
input,button{padding:14px;margin:6px 0;border-radius:10px;border:0;width:100%;box-sizing:border-box;font-size:16px}
button{background:#0a84ff;color:#fff;font-weight:bold}
.rec{background:#ff3b30}.recording{background:#34c759}
.section{background:#1a1a1a;padding:12px;border-radius:10px;margin:10px 0}
#musicList, #msgList{list-style:none;padding:0;max-height:120px;overflow:auto}
#musicList li, #msgList li{background:#222;padding:8px;margin:4px 0;border-radius:6px;font-size:14px}
#status{color:#0f0;margin-top:10px;text-align:center}
</style>
</head>
<body>
<h2>DJ Dual Mixer</h2>

<div class="section">
  <h3>1. Music Playlist</h3>
  <input id="musicUrl" placeholder="Paste MP3 URL for music">
  <button onclick="addMusic()">+ Add Music</button>
  <button onclick="playMusic()">▶️ Play Music</button>
  <ul id="musicList"></ul>
  Normal Vol: <input id="vol" type="range" min="20" max="100" value="100" oninput="setVol(this.value)"> <span id="volTxt">100</span>%
</div>

<div class="section">
  <h3>2. Message Playlist - plays 10s after record</h3>
  <button id="recBtn" class="rec" onclick="toggleRec()">🎤 Record Message</button>
  <ul id="msgList"></ul>
</div>

<div id="status">Ready</div>

<script>
let ctx, gainNode, musicAudio;
let normalVol = 1.0; // 100%
let musicPlaylist = []; let musicIndex = 0; let musicPlaying = false;
let msgQueue = []; // {blob, playAt}
let mediaRec, chunks = [];

async function init(){
  if(ctx) return;
  ctx = new AudioContext();
  gainNode = ctx.createGain();
  gainNode.gain.value = normalVol;
}

// MUSIC
function addMusic(){
  let url = musicUrl.value.trim();
  if(!url) return;
  musicPlaylist.push(url);
  musicList.innerHTML += `<li>${musicPlaylist.length}. ${url.split('/').pop()}</li>`;
  musicUrl.value='';
}

function setVol(v){
  normalVol = v/100;
  volTxt.innerText=v;
  if(gainNode &&!isDucked) gainNode.gain.value=normalVol;
}
let isDucked = false;

async function playMusic(){
  if(!musicPlaylist.length) return alert('Add music first');
  await init();
  musicPlaying = true;
  playMusicTrack(musicIndex);
  tick(); // start message queue checker
}

function playMusicTrack(index){
  musicAudio = new Audio(musicPlaylist[index]);
  musicAudio.crossOrigin = "anonymous";
  musicAudio.loop = false;
  ctx.createMediaElementSource(musicAudio).connect(gainNode).connect(ctx.destination);
  gainNode.gain.value = normalVol; // ensure at normal vol
  musicAudio.play();
  status.innerText = `Music: ${musicPlaylist[index].split('/').pop()}`;

  musicAudio.onended = () => {
    musicIndex = (musicIndex + 1) % musicPlaylist.length;
    playMusicTrack(musicIndex); // loop playlist
  }
}

// MESSAGES
function toggleRec(){
  if(!mediaRec) startRec(); else stopRec();
}

async function startRec(){
  await init();
  let s = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec = new MediaRecorder(s); chunks=[];
  mediaRec.ondataavailable = e => chunks.push(e.data);
  mediaRec.onstop = () => {
    let blob = new Blob(chunks, {type:'audio/webm'});
    let playAt = Date.now() + 10000; // 10 seconds after recording
    msgQueue.push({blob, playAt});
    msgList.innerHTML += `<li>Message ${msgQueue.length} - plays in 10s</li>`;
    status.innerText = `Message queued. Will mix in 10s`;
  }
  mediaRec.start();
  recBtn.innerText = '⏹️ Stop Recording'; recBtn.className='recording';
}

function stopRec(){
  mediaRec.stop(); mediaRec.stream.getTracks().forEach(t=>t.stop()); mediaRec=null;
  recBtn.innerText = '🎤 Record Message'; recBtn.className='rec';
}

// Check queue every 200ms
function tick(){
  setInterval(()=>{
    if(msgQueue.length && Date.now() >= msgQueue[0].playAt){
      playMessage(msgQueue.shift());
    }
  },200);
}

function playMessage(item){
  if(!musicPlaying) return;
  isDucked = true;

  // DUCK music to 30%
  gainNode.gain.setTargetAtTime(0.3, ctx.currentTime, 0.3);

  let msgAudio = new Audio(URL.createObjectURL(item.blob));
  ctx.createMediaElementSource(msgAudio).connect(ctx.destination); // message at 100%
  msgAudio.play();
  status.innerText = 'Playing message over music - music at 30%';

  msgList.innerHTML += `<li style="color:#0f0">✓ Played</li>`;

  msgAudio.onended = () => {
    // RESTORE music to normal volume
    gainNode.gain.setTargetAtTime(normalVol, ctx.currentTime, 0.5);
    isDucked = false;
    status.innerText = 'Music back to normal';
  }
}
</script>
</body>
</html>
