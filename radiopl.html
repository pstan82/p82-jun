<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radio Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#111;color:#eee;padding:20px;max-width:900px;margin:auto}
input,button{padding:9px;margin:4px;font-size:15px;border-radius:6px;border:0}
button{background:#0a84ff;color:#fff;cursor:pointer}
#list{list-style:none;padding:0} #list li{padding:10px;background:#1a1a1a;margin:4px 0;border-radius:6px}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<h2>Online Radio</h2>
<input id="url" placeholder="Paste https radio url" size="40">
<button onclick="play()">Play</button>
<audio id="player" controls crossorigin="anonymous"></audio>

<script>
function play(){
  let url = document.getElementById('url').value.trim();
  if(!url) return alert('Paste URL');
  document.getElementById('player').src = url;
  document.getElementById('player').play().catch(e=>alert('Error: '+e.message));
}
</script>

<!-- MOBILE CONSOLE -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
